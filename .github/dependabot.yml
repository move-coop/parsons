version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions-monthly-updates:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-type: development
