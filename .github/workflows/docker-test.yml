name: Docker checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - major-release
  schedule:
    - cron: 0 0 * * 1

permissions: read-all

env:
  ENDPOINT_WHITELIST: >-
    ghcr.io:443
    pypi.org:443
    github.com:443
    releases.astral.sh:443
    files.pythonhosted.org:443
    *.github.com:443
    *.githubusercontent.com:443

jobs:
  test-dockerfile:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: auth.docker.io:443 ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true # Loads the image into the local Docker daemon for testing
          tags: parsons:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: docker run --rm parsons:test python3 -c "import sys; print('Python version:', sys.version)"

      - run: docker run --rm parsons:test python3 -c "from parsons import Table; print('Table imported successfully!')"

      - run: docker run --rm parsons:test python3 -c "from parsons import CivisClient; print('CivisClient loaded successfully!')"
