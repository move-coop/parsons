name: Docker checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - major-release
  schedule:
    - cron: 0 0 * * 1

permissions: read-all

env:
  ENDPOINT_WHITELIST: >-
    ghcr.io:443
    pypi.org:443
    github.com:443
    releases.astral.sh:443
    files.pythonhosted.org:443
    *.github.com:443
    *.githubusercontent.com:443

jobs:
  test-dockerfile:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: auth.docker.io:443 ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true # Loads the image into the local Docker daemon for testing
          tags: parsons:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test that python commands work
        run: |
          docker run --rm parsons:test python3 -c "
          import sys
          print('Python version:', sys.version)
          "

      - name: Test that Table can be imported
        run: |
          docker run --rm parsons:test python3 -c "
          from parsons import Table
          print('Table imported successfully!')
          "

      - name: Test that CivisClient can be imported
        run: |
          docker run --rm parsons:test python3 -c "
          from parsons import CivisClient
          print('CivisClient loaded successfully!')
          "

      - name: Test that Table can be used
        run: |
          docker run --rm parsons:test python3 -c "
          from parsons import Table
          test_data = {'a': 1, 'b': 2, 'c': 3}
          tbl = Table([test_data])
          assert tbl[0] == test_data
          print('Basic Table function confirmed!')
          "
