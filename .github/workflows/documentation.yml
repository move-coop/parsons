name: Documentation CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - major-release
    tags:
      - 'v*'
permissions: read-all

env:
  ENDPOINT_WHITELIST: >-
    pypi.org:443
    github.com:443
    releases.astral.sh
    files.pythonhosted.org:443
    *.github.com:443
    *.githubusercontent.com:443

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: 3.14
          activate-environment: true
          cache-suffix: ${{ github.workflow }}

      - run: >-
          uv sync
          --no-default-groups
          --group docs
          --all-extras

      - run: make linkcheck ${{ runner.debug == '1' && '--verbose' || '' }}
        working-directory: docs
        continue-on-error: true

  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: 3.14
          activate-environment: true
          cache-suffix: ${{ github.workflow }}

      - run: >-
          uv sync
          --no-default-groups
          --group docs
          --all-extras

      - run: make test ${{ runner.debug == '1' && '--verbose' || '' }}
        working-directory: docs

  build-multiversion:
    needs: test-build

    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # If it's a pull request, don't get full history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: 3.14
          activate-environment: true
          cache-suffix: ${{ github.workflow }}

      - run: >-
          uv sync
          --no-default-groups
          --group docs
          --all-extras

      - name: configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: docs/html
          key: sphinx-${{ hashFiles('docs/make.py', 'docs/conf.py') }}

      - run: make build_docs
        working-directory: docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/html/

  deploy:
    needs: build-multiversion

    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
