name: Python checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - major-release
  schedule:
    - cron: 0 0 * * 1

permissions: read-all

env:
  CACHE_GLOBS: |
    **/pyproject.toml
    **/setup.py
    **/uv.lock
  ENDPOINT_WHITELIST: >-
    pypi.org:443
    github.com:443
    releases.astral.sh
    files.pythonhosted.org:443
    *.github.com:443
    *.githubusercontent.com:443

jobs:
  pytest:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        resolution:
          - highest
          - lowest-direct

    permissions:
      contents: write

    concurrency:
      group: >-
        ${{ github.workflow }}
        -${{ github.job }}
        -${{ github.event.pull_request.number || github.ref }}
        -${{ matrix.os }}
        -${{ matrix.python-version }}
        -${{ matrix.resolution }}
      cancel-in-progress: true

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: auth.docker.io:443 ${{ env.ENDPOINT_WHITELIST}}

      - name: determine key for pytest cache
        id: pytest-run-key
        shell: bash
        run: |
          HASH=${{ hashFiles('pyproject.toml') }}
          VAL="${HASH}-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.resolution }}"
          echo "RUN_KEY=$VAL" >> $GITHUB_ENV

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - env:
          UV_RESOLUTION: ${{ matrix.resolution }}
        run: >-
          uv sync
          --upgrade
          --no-default-groups
          --group test-coverage
          --all-extras

      - id: cache-pytest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pytest_cache
          key: pytest-${{ env.RUN_KEY }}

      - env:
          COVERAGE_FILE: .coverage.${{ env.RUN_KEY }}
        run: >-
          pytest
          --failed-first
          --cov=parsons
          --no-cov-on-fail

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ env.RUN_KEY }}
          path: .coverage.${{ env.RUN_KEY }}
          include-hidden-files: true

  pytest-extras-config:
    runs-on: ubuntu-latest

    outputs:
      extras: ${{ steps.get-extras.outputs.extras }}

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: 3.14
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --upgrade
          --no-default-groups
          --group ci
          --all-extras

      - name: create list of all parsons extras
        id: get-extras
        run: |
          python -c "
          import json
          from build.util import project_wheel_metadata
          from pathlib import Path

          metadata = project_wheel_metadata(Path('.'))
          extras = metadata.get_all('Provides-Extra') or []

          if 'all' in extras:
            extras.remove('all')

          print(json.dumps(extras))
          " > extras.json
          echo "extras=$(cat extras.json)" >> $GITHUB_OUTPUT

  pytest-extras:
    runs-on: ${{ matrix.os }}

    needs:
      - pytest-extras-config
      - pytest

    strategy:
      fail-fast: false
      matrix:
        extra: ${{ fromJson(needs.pytest-extras-config.outputs.extras) }}
        python-version: ['3.14']
        os: ['ubuntu-latest']
        resolution: ['highest']

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - name: determine key for pytest cache
        id: pytest-run-key
        shell: bash
        run: |
          HASH=${{ hashFiles('pyproject.toml') }}
          VAL="${HASH}-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.resolution }}"
          echo "RUN_KEY=$VAL" >> $GITHUB_ENV

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - env:
          UV_RESOLUTION: ${{ matrix.resolution }}
        run: >-
          uv sync
          --upgrade
          --no-default-groups
          --group test-coverage
          --extra ${{ matrix.extra }}

      - id: cache-pytest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pytest_cache
          key: pytest-${{ env.RUN_KEY }}

      - run: pytest test/test_${{ matrix.extra }}

      # Advisory during the migration: if this connector has a committed
      # baseline, compare the current suite's coverage against it and render the
      # result to the job summary. Coverage only (fast); mutation parity runs in
      # the separate `parity-mutation` job. Does not fail the build yet.
      - name: coverage parity vs baseline (advisory)
        if: hashFiles(format('test/baselines/{0}.json', matrix.extra)) != ''
        run: >-
          python test/tools/parity.py compare "${{ matrix.extra }}"
          --no-mutation --markdown | tee -a "$GITHUB_STEP_SUMMARY"

  # Mutation parity is the signal coverage cannot give: it catches assertions that
  # execute code without checking its behavior. It is slow, so on pull requests it
  # runs only for connectors the PR changed that already have a baseline; on the
  # weekly schedule (and manual dispatch) it sweeps every baselined connector,
  # doubling as the drift monitor. Advisory: renders to the job summary, never
  # fails the build during the migration.
  parity-mutation:
    runs-on: ubuntu-latest

    # Gate on the pytest matrix. Mutation testing re-runs the tests itself and is
    # only meaningful when they pass on clean code, so there's nothing to learn from
    # running it on an already-red PR — and this way it shows as skipped, not failed,
    # when the suite is broken, instead of burning the slow mutation compute.
    needs: pytest

    # Advisory only (see below): mutation runs are slow, and a PR that touches many
    # connectors can exceed the time budget, so never let this block the build.
    continue-on-error: true
    timeout-minutes: 45

    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Full history so we can diff a pull request against its base commit.
          fetch-depth: 0

      # Compute the work list with the runner's system Python (no project deps
      # needed) so we can skip the expensive dependency sync when there is nothing
      # to check.
      - name: determine connectors to check
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LIST=$(python3 test/tools/changed_connectors.py --base "${{ github.event.pull_request.base.sha }}")
          else
            LIST=$(python3 test/tools/changed_connectors.py --all)
          fi
          ALL=$(echo "$LIST" | tr '\n' ' ' | xargs)
          TOTAL=$(echo "$ALL" | wc -w | xargs)
          # Mutation runs take minutes per connector, so a PR that touches many of them
          # cannot finish within the CI time budget. Above this many, skip mutation in CI
          # (it stays advisory) and leave a note; run parity.py locally for the rest.
          MAX=5
          if [ "$TOTAL" -gt "$MAX" ]; then
            echo "connectors=" >> "$GITHUB_OUTPUT"
            echo "skipped_total=$TOTAL" >> "$GITHUB_OUTPUT"
          else
            echo "connectors=$ALL" >> "$GITHUB_OUTPUT"
            echo "skipped_total=0" >> "$GITHUB_OUTPUT"
          fi

      - name: note skipped mutation parity (large PR)
        if: steps.scope.outputs.skipped_total != '0'
        run: |
          {
            echo "### Mutation parity — skipped (advisory)"
            echo ""
            echo "This PR changes ${{ steps.scope.outputs.skipped_total }} connectors. Mutation"
            echo "testing takes minutes per connector, so CI skips it on large PRs to stay within"
            echo "the time budget — the pytest job still checked coverage parity. Run"
            echo '`python test/tools/parity.py compare <connector>` locally for mutation parity.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: steps.scope.outputs.connectors != ''
        with:
          python-version: 3.13
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - if: steps.scope.outputs.connectors != ''
        run: >-
          uv sync
          --upgrade
          --no-default-groups
          --group mutation
          --all-extras

      - name: mutation parity vs baseline (advisory)
        if: steps.scope.outputs.connectors != ''
        run: |
          for c in ${{ steps.scope.outputs.connectors }}; do
            python test/tools/parity.py compare "$c" --markdown \
              | tee -a "$GITHUB_STEP_SUMMARY" \
              || echo "⚠️ parity run failed for $c (see logs)" >> "$GITHUB_STEP_SUMMARY"
          done

  ruff-format:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: 3.14
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --upgrade
          --no-default-groups
          --group lint

      - id: cache-ruff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ruff_cache
          key: ruff-${{ hashFiles('pyproject.toml') }}

      - id: run-ruff
        run: >-
          ruff format
          --diff
          .

  ruff-check:
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: 3.14
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --upgrade
          --no-default-groups
          --group lint

      - id: cache-ruff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ruff_cache
          key: ruff-${{ hashFiles('pyproject.toml') }}

      - id: run-ruff-sarif
        run: >-
          ruff check
          --output-format=sarif
          -o results.sarif
          .

      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        if: ( success() || failure() ) && contains('["success", "failure"]', steps.run-ruff-sarif.outcome)
        with:
          sarif_file: results.sarif

      - id: run-ruff
        if: failure() && contains('["failure"]', steps.run-ruff-sarif.outcome)
        run: >-
          ruff check
          --output-format=github
          .

  bandit:
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: 3.14
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --upgrade
          --no-default-groups
          --group security

      - id: run-bandit-sarif
        run: >-
          bandit
          --confidence-level 'medium'
          --severity-level 'medium'
          --recursive 'parsons'
          --format 'sarif'
          --output 'results.sarif'

      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        if: ( success() || failure() ) && contains('["success", "failure"]', steps.run-bandit-sarif.outcome)
        with:
          sarif_file: results.sarif

      - id: run-bandit
        if: failure() && contains('["failure"]', steps.run-bandit-sarif.outcome)
        run: >-
          bandit
          --confidence-level 'medium'
          --severity-level 'medium'
          --recursive 'parsons'

  coverage:
    runs-on: ubuntu-latest

    needs:
      - pytest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: img.shields.io:443 ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          merge-multiple: true

      - id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@63f52f4fbbffada6e8dee8ec432de7e01df9ba79
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COVERAGE_FILES: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  sphinx-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: 3.14
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --upgrade
          --no-default-groups
          --group docs

      - run: sphinx-lint docs

      - run: sphinx-lint parsons

  pre-commit:
    runs-on: ubuntu-latest

    needs:
      - bandit
      - ruff-format
      - ruff-check
      - sphinx-lint

    permissions:
      contents: write

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: proxy.golang.org:443 ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: 3.14
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --upgrade
          --no-default-groups
          --group pre-commit

      - id: cache-pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pre-commit-cache
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', 'pyproject.toml') }}

      - env:
          PRE_COMMIT_HOME: .pre-commit-cache
        run: >-
          pre-commit run
          --all-files
