name: Type Stubs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - major-release

permissions: read-all

env:
  ENDPOINT_WHITELIST: >-
    pypi.org:443
    github.com:443
    releases.astral.sh:443
    files.pythonhosted.org:443
    *.github.com:443
    *.githubusercontent.com:443

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-stubs:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: 3.14
          activate-environment: true
          cache-suffix: ${{ github.workflow }}

      - run: >-
          uv sync
          --no-default-groups
          --all-extras

      - run: python types/generate_init_pyi.py

      - name: check if __init__.pyi needs to be updated
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::group::diff of __init__.pyi"
            git diff
            echo "::endgroup::"
            echo "::error title=Type stubs are out of date::Run 'python types/generate_init_pyi.py' to update '__init__.pyi'."
            exit 1
          else
            echo "::debug::Type stubs validated successfully"
          fi
