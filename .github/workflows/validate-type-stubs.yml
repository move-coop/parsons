name: Type Stubs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - major-release

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-stubs:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: 3.14
          activate-environment: true

      - run: >-
          uv sync
          --no-default-groups
          --all-extras

      - run: python types/generate_init_pyi.py

      - name: check if __init__.pyi needs to be updated
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::group::diff of __init__.pyi"
            git diff
            echo "::endgroup::"
            echo "::error title=Type stubs are out of date::Run 'python types/generate_init_pyi.py' to update '__init__.pyi'."
            exit 1
          else
            echo "::debug::Type stubs validated successfully"
          fi
