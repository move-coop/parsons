repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: ['--fix']
        exclude_types: ["pyi"]
      - id: ruff-format
        exclude_types: ["pyi"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['--confidence-level', 'medium', '--severity-level', 'medium', '--exclude', '**/vendor/*']
        files: '^parsons'

  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: v1.0.2
    hooks:
      - id: sphinx-lint
        name: sphinx lint

  - repo: local
    hooks:
      - id: generate-stubs
        name: generate stubs
        entry: python ./types/generate_init_pyi.py
        language: system
        pass_filenames: false
